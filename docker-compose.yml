services:
  mongcook:
    build: .
    container_name: mongcook-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/moongcook.db
    env_file:
      - .env
    volumes:
      # Named volume: survives deploys (the checkout's moongcook.db is only the first-boot seed).
      - mongcook-data:/app/data
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mongcook.rule=Host(`moongcook.iaportafolio.com`)"
      - "traefik.http.routers.mongcook.entrypoints=websecure"
      - "traefik.http.routers.mongcook.tls.certresolver=letsencrypt"
      - "traefik.http.services.mongcook.loadbalancer.server.port=3000"

volumes:
  mongcook-data:

networks:
  traefik-public:
    external: true
